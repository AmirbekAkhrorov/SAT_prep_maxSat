# Netlify hosts the Vite frontend only. The Django API deploys to Render
# (see render.yaml) because Netlify's functions are Node.js-only — there is
# no Python runtime to run Django on.
#
# Build from the repo root, not packages/frontend: this is an npm workspace,
# and installing from inside the package skips the root lockfile and
# hoisted dependencies.

[build]
  command = "npm run build"
  publish = "packages/frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  # The Render API origin plus /api. Pinned here rather than in the Netlify UI
  # so the build is reproducible and reviewable: this is a public URL, not a
  # secret, and a UI value that silently fails to save bakes in the "/api"
  # fallback, which makes every API call hit the SPA redirect and return HTML.
  # Read at BUILD time — changing it requires a redeploy, not just a restart.
  VITE_API_URL = "https://satprep-api.onrender.com/api"

# react-router owns client-side routing; every unknown path must serve the
# SPA shell or /login, /cabinet/... 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Vite fingerprints these filenames, so they are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
