# Render blueprint: Django API + managed Postgres.
#
# The frontend is NOT here — it deploys to Netlify (see netlify.toml).
# Netlify cannot host this backend: its serverless functions are Node.js only,
# with no Python runtime.
#
# To deploy: Render Dashboard > New > Blueprint, point it at this repo.
# Then set the env vars marked sync:false below.

databases:
  - name: satprep-db
    databaseName: satprep
    plan: free
    # RETIRED: the service now uses Neon (see DATABASE_URL below). This free
    # database expires around 2026-10-18 and nothing reads it any more.
    # Remove this block once the Neon switch has been live for a day,
    # otherwise the Blueprint re-creates an unused free database after Render
    # deletes this one.

services:
  - type: web
    name: satprep-api
    runtime: python
    plan: free
    rootDir: packages/backend
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn sat_prep.wsgi:application --bind 0.0.0.0:$PORT"
    # Dedicated plain-Django endpoint: no DRF throttling (the probe would
    # otherwise exhaust the anon rate limit and get cycled) and exempt from
    # SECURE_SSL_REDIRECT, so the internal HTTP probe sees 200 not 301.
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Neon Postgres (free plan, never expires), region AWS us-west-2 (Oregon),
      # next to this service. Set in the dashboard because it contains the
      # password. Use the direct connection string, not the "-pooler" one: the
      # pooler runs in transaction mode, which breaks psycopg's prepared
      # statements. settings.py refuses to start without it in production.
      - key: DATABASE_URL
        sync: false
      # Generated by Render; never reuse the key from git history.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # This is the PRIVATE-network hostname (Render's spec: "the service's
      # hostname on the private network"), used for service-to-service calls.
      # It is NOT the public satprep-api.onrender.com name — settings.py adds
      # that from RENDER_EXTERNAL_HOSTNAME, which Render sets automatically.
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: satprep-api
          property: host
      # Set to the Netlify site origin once it exists, e.g.
      #   https://maxsat.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # "none" because no SMTP is configured yet: with "mandatory" allauth
      # tries to send a confirmation mail and every signup 500s. Switch this
      # to "mandatory" the moment EMAIL_HOST below is filled in.
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: none
      # NOTE: EMAIL_HOST / EMAIL_HOST_USER / EMAIL_HOST_PASSWORD are
      # deliberately NOT declared here. Render prompts for a value for every
      # "sync: false" key, and any placeholder in EMAIL_HOST switches Django
      # off the console backend and onto SMTP — which is exactly the
      # connection-refused 500 this config exists to avoid. Add them in the
      # dashboard (Environment > Add) only when you have real credentials,
      # and flip ACCOUNT_EMAIL_VERIFICATION to "mandatory" at the same time.
      #
      # DJANGO_SUPERUSER_EMAIL and DJANGO_SUPERUSER_PASSWORD (plus the optional
      # DJANGO_SUPERUSER_USERNAME) are also set only in the dashboard.
      # render-build.sh runs ensure_superuser, which creates or promotes that
      # admin on every deploy. Keep the password out of this file: variables
      # added in the dashboard survive Blueprint syncs.
