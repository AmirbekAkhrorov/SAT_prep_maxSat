# Render blueprint: Django API + managed Postgres.
#
# The frontend is NOT here — it deploys to Netlify (see netlify.toml).
# Netlify cannot host this backend: its serverless functions are Node.js only,
# with no Python runtime.
#
# To deploy: Render Dashboard > New > Blueprint, point it at this repo.
# Then set the env vars marked sync:false below.

databases:
  - name: satprep-db
    databaseName: satprep
    plan: free
    # Free Postgres on Render expires after 30 days — move to a paid plan
    # before then or the data is deleted.

services:
  - type: web
    name: satprep-api
    runtime: python
    plan: free
    rootDir: packages/backend
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn sat_prep.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/questions/stats/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: satprep-db
          property: connectionString
      # Generated by Render; never reuse the key from git history.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Render injects the service's own hostname here.
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: satprep-api
          property: host
      # Set to the Netlify site origin once it exists, e.g.
      #   https://maxsat.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Requires SMTP to be configured, otherwise signups cannot confirm.
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: mandatory
